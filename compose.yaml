services:
  predictor:
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ./models:/app/models:ro
    secrets:
      - predictor_config
    mem_limit: 3g
    cpus: 2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PREDICTOR_DOMAIN: ${PREDICTOR_DOMAIN:?Run configure.py first}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      predictor:
        condition: service_healthy
secrets:
  predictor_config:
    file: ./secrets/config.json
volumes:
  caddy_data:
  caddy_config:
